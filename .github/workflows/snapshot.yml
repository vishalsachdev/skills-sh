name: Daily Skills Snapshot

on:
  workflow_dispatch:
  schedule:
    # Run 3x/day so missed cron triggers don't cause gaps
    - cron: '15 7 * * *'
    - cron: '15 13 * * *'
    - cron: '15 19 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure GitHub CLI is available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Check if today's snapshot exists
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          if [ -f "snapshots/${TODAY}.json" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Snapshot for $TODAY already exists, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No snapshot for $TODAY, will generate."
          fi

      - name: Generate snapshot
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python snapshot.py

      - name: Generate daily trend report
        if: steps.check.outputs.skip != 'true'
        run: python generate_daily_report.py

      - name: Commit snapshot and daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/ analysis/daily/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update skills snapshot"
            git push
          fi

      - name: Copy latest snapshot for dashboard
        run: |
          mkdir -p site/data
          LATEST=$(ls -t snapshots/*.json | head -1)
          cp "$LATEST" site/data/latest.json
          echo "Copied $LATEST to site/data/latest.json"

      - name: Generate timeseries data
        run: python generate_timeseries.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
